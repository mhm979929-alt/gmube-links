<style>
  :root{--bg:#070A0F;--card:#0F151D;--line:rgba(255,255,255,.08);--text:#EDF2F7;--text2:#9BABBB;--text3:#67788A;--brand:#10B981;--brand2:#34D399;--ink:#04150F}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;min-height:100vh;background:radial-gradient(120% 90% at 50% 0%,#0C1A16 0%,var(--bg) 55%);color:var(--text);
       font-family:"Cairo","Segoe UI",system-ui,-apple-system,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{width:100%;max-width:390px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px 20px 24px;
        text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.55)}
  .thumb{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:14px;background:#141C26;display:block;margin-bottom:16px}
  .badge{display:inline-block;font-size:11.5px;color:var(--brand2);background:rgba(16,185,129,.12);border:1px solid rgba(16,185,129,.3);
         padding:4px 10px;border-radius:999px;margin-bottom:10px}
  h1{margin:0 0 8px;font-size:18px;line-height:1.6;font-weight:700}
  p{margin:0;font-size:13.5px;line-height:1.9;color:var(--text2)}
  .btn{display:block;width:100%;margin-top:20px;padding:15px 18px;border:0;border-radius:14px;background:var(--brand);color:var(--ink);
       font-family:inherit;font-size:15.5px;font-weight:700;cursor:pointer;text-decoration:none}
  .btn:active{opacity:.85}
  .btn.ghost{margin-top:10px;background:transparent;border:1px solid var(--line);color:var(--text2);font-weight:500;font-size:13.5px;padding:12px 18px}
  .hint{margin-top:14px;font-size:12px;color:var(--text3);line-height:1.9}
  .hidden{display:none!important}
  .spin{width:32px;height:32px;margin:6px auto 14px;border:3px solid rgba(255,255,255,.12);border-top-color:var(--brand2);border-radius:50%;animation:spin .9s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="card">
  <div id="loading">
    <div class="spin"></div>
    <h1>جارٍ الفتح…</h1>
    <p>سيُفتح التطبيق خلال لحظة.</p>
  </div>

  <div id="open" class="hidden">
    <img class="thumb" src="https://i.ytimg.com/vi/_z27ausbhKQ/maxresdefault.jpg" alt="الجلسة الأول من درس التوازن الكيميائي" onerror="this.style.display='none'">
    <div class="badge">درس</div>
    <h1>الجلسة الأول من درس التوازن الكيميائي</h1>
    <p>كيمياء — البكالوريا · مع أ.علاء العلي</p>
    <button class="btn" id="openBtn" type="button">افتح الدرس في التطبيق</button>
    <a class="btn ghost" href="https://github.com/mhm979929-alt/gmube-releases/releases/latest">تثبيت التطبيق</a>
    <div class="hint">إن لم يُفتح التطبيق تلقائياً، اضغط الزرّ أعلاه.</div>
  </div>
</div>
<script>
(function(){
  var appLink = "gmube://watch/6aacf2f03ff3dc00602f";
  var left = false;
  function onLeave(){ left = true; }
  document.addEventListener('visibilitychange', function(){ if(document.hidden) onLeave(); });
  window.addEventListener('blur', onLeave);
  window.addEventListener('pagehide', onLeave);
  function openApp(){ left = false; window.location.href = appLink; }
  document.getElementById('openBtn').addEventListener('click', openApp);
  setTimeout(openApp, 250);
  setTimeout(function(){
    if (left || document.hidden) return;
    document.getElementById('loading').classList.add('hidden');
    document.getElementById('open').classList.remove('hidden');
  }, 1700);
})();
</script>
</body>
